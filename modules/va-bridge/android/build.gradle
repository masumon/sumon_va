plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.masumon.sumonva'
version = '1.0.0'

android {
  namespace "expo.modules.vabridge"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Android Keystore-backed storage: the device token never sits in plain text, and JavaScript never sees it.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
